<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#050505">

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <title>Сторінку не знайдено · Dark Shibari</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#050505;
      color:#d0d0d0;
      font-family:'Inter',sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:6%;
    }
    .code {
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(4rem,15vw,9rem);
      color:#000;
      -webkit-text-stroke:1.6px #8b0000;
      letter-spacing:0.1em;
      line-height:1;
      margin-bottom:1.5rem;
    }
    h1 {
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(1.6rem,5vw,2.2rem);
      color:#c9a96e;
      letter-spacing:0.15em;
      margin-bottom:1.2rem;
      font-weight:400;
    }
    p {
      color:#888;
      margin-bottom:2.5rem;
      font-size:1rem;
    }
    a.btn {
      display:inline-block;
      padding:1rem 2.6rem;
      border:1px solid #8b0000;
      color:#e0d0b0;
      text-decoration:none;
      letter-spacing:0.2em;
      font-size:0.9rem;
      transition:all .4s;
    }
    a.btn:hover { background:#8b0000; color:#111; }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>СТОРІНКУ НЕ ЗНАЙДЕНО</h1>
    <p>Здається, ти забрів у темряву, де немає світла.</p>
    <a href="/" class="btn">НА ГОЛОВНУ</a>
  </div>
</body>
</html>
